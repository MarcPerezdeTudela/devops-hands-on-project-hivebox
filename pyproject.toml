[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hivebox"
version = "0.1.0"
description = "REST API for beekeepers based on openSenseMap data"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-httpx==0.36.2",
]
quality = [
    "build==1.5.0",
    "mypy==2.3.1",
    "pylint==4.0.7",
    "ruff==0.16.4",
    "twine==7.0.0",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true

[tool.pylint.main]
persistent = false
py-version = "3.13"

[tool.ruff]
line-length = 88
target-version = "py313"
