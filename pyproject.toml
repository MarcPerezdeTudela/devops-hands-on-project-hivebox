[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hivebox"
version = "0.0.1"
description = "REST API for beekeepers based on openSenseMap data"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.setuptools.packages.find]
include = ["src*"]
