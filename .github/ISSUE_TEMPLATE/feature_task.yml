name: Feature or implementation task
description: Propose a focused improvement to HiveBox.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement. Do not include credentials,
        tokens, private keys, or other sensitive data. Report security
        vulnerabilities through the private channel in the issue chooser.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the problem to solve or the outcome to deliver.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Explain why this matters and link related work or documentation when useful.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the observable conditions that define completion.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
      description: Describe the focused tests or checks that should demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: security-operations
    attributes:
      label: Security or operational considerations
      description: Note relevant risks, deployment effects, monitoring, or state that none are known.
